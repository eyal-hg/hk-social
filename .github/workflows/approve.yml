name: approve-week
on:
  workflow_dispatch:
    inputs:
      week:
        description: "week folder, e.g. 2026-W40"
        required: true
      page:
        description: "which brand: money or studio"
        required: true
        type: choice
        options: [money, studio]
      except:
        description: "post ids to reject, comma separated (optional)"
        required: false
        default: ""
permissions:
  contents: write
concurrency: { group: repo-write, cancel-in-progress: false }
jobs:
  approve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - env:
          WEEK: ${{ inputs.week }}
          PAGE: ${{ inputs.page }}
          EXCEPT: ${{ inputs.except }}
        run: |
          if [ -n "$EXCEPT" ]; then python scripts/approve.py "$WEEK" --page "$PAGE" --except "$EXCEPT"; else python scripts/approve.py "$WEEK" --page "$PAGE"; fi
          pip install pillow >/dev/null && python scripts/review.py && python scripts/site.py
      - run: |
          git config user.name "hk-social-bot"
          git config user.email "hk-social-bot@users.noreply.github.com"
          git add posts review.html docs
          git diff --cached --quiet || (git commit -m "approve ${{ inputs.week }} (${{ inputs.page }})" && git push)
