name: check-connection
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/check.yml", "scripts/check.py"]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          PAGE_ID: "459554967250420"
          IG_ID: "17841465042070519"
          IMAGE_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/main/out
        working-directory: scripts
        run: python check.py
