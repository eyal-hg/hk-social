name: ads-apply
on:
  workflow_dispatch:
    inputs:
      plan:
        description: "plan file, e.g. ads/plans/2026-09-27-x.json"
        required: true
permissions:
  contents: write
concurrency: { group: repo-write, cancel-in-progress: false }
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: apply ads plan
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          AD_ACCOUNT_ID: "1886192278456348"
          PAGE_ID: "459554967250420"
          STUDIO_PAGE_ID: ${{ vars.STUDIO_PAGE_ID }}
          IMAGE_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/main/out
        run: python scripts/ads_apply.py "${{ inputs.plan }}"
      - name: record
        if: always()
        run: |
          git config user.name "hk-social-bot"
          git config user.email "hk-social-bot@users.noreply.github.com"
          git add ads
          git diff --cached --quiet || (git commit -m "ads plan applied: ${{ inputs.plan }}" && git push)
