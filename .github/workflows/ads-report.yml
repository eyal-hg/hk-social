name: ads-report
on:
  schedule:                # דקות לא עגולות (GitHub מאחר פחות), כמה מועדים לפני המייל של 08:00 ישראל
    - cron: "37 22 * * *"  # 01:37 ישראל
    - cron: "37 0 * * *"   # 03:37
    - cron: "37 2 * * *"   # 05:37
    - cron: "7 4 * * *"    # 07:07
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: repo-write, cancel-in-progress: false }
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: read-only ads report
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          AD_ACCOUNT_ID: "1886192278456348"
        run: python scripts/ads.py
      - name: commit report
        run: |
          git config user.name "hk-social-bot"
          git config user.email "hk-social-bot@users.noreply.github.com"
          git add reports
          git diff --cached --quiet || (git commit -m "ads report" && git pull --rebase origin main && git push)
