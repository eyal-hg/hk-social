name: ads-report
on:
  schedule:                # GitHub מריץ cron באיחור של דקות עד שעות; כמה מועדים כדי שדוח טרי יהיה מוכן לפני המייל של 08:00
    - cron: "0 3 * * *"    # 06:00 / 05:00 ישראל
    - cron: "45 3 * * *"   # 06:45 / 05:45
    - cron: "30 4 * * *"   # 07:30 / 06:30
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: repo-write, cancel-in-progress: false }
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: read-only ads report
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          AD_ACCOUNT_ID: "1886192278456348"
        run: python scripts/ads.py
      - name: commit report
        run: |
          git config user.name "hk-social-bot"
          git config user.email "hk-social-bot@users.noreply.github.com"
          git add reports
          git diff --cached --quiet || (git commit -m "ads report" && git pull --rebase origin main && git push)
