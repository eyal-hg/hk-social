name: render
on:
  push:
    paths: ["posts/**", "template/**", "scripts/render.py", "scripts/review.py"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: repo-write, cancel-in-progress: false }
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pillow
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-core
      - run: python scripts/render.py && python scripts/review.py && python scripts/site.py
      - name: commit
        run: |
          git config user.name "hk-social-bot"
          git config user.email "hk-social-bot@users.noreply.github.com"
          git add out review.html docs
          git diff --cached --quiet || (git commit -m "render posts" && git push)
