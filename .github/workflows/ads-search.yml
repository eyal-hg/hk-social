name: ads-search
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: repo-write, cancel-in-progress: false }
jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: look up targeting options (read-only)
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          AD_ACCOUNT_ID: "1886192278456348"
        run: python scripts/ads_search.py
      - name: commit
        run: |
          git config user.name "hk-social-bot"
          git config user.email "hk-social-bot@users.noreply.github.com"
          git add ads/targeting-options.json
          git diff --cached --quiet || (git commit -m "ads: targeting options" && git pull --rebase origin main && git push)
