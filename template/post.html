<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&family=Karantina:wght@400;700&family=Rubik:wght@500;700;800&display=swap" rel="stylesheet" />
<style>
  :root { --navy:#0c4068; --navy2:#082f4d; --salmon:#e48375; --salmon2:#d4705f; --blue:#39abe2; --off:#eef4f9; --text:#333344; --muted:#56677a; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body { font-family: 'Heebo', sans-serif; position: relative; color: #fff; background: linear-gradient(160deg, var(--navy) 0%, var(--navy2) 100%); }
  em { font-style: normal; color: var(--salmon); }
  .logo { position: absolute; top: 70px; right: 80px; height: 66px; }
  .kicker { position: absolute; top: 70px; left: 80px; font-family: 'Rubik', sans-serif; font-weight: 700; font-size: 30px; color: var(--navy); background: var(--salmon); border-radius: 60px; padding: 12px 30px; }
  .bottom { position: absolute; bottom: 0; right: 0; left: 0; height: 160px; background: var(--off); color: var(--navy); display: flex; align-items: center; justify-content: space-between; padding: 0 80px; }
  .cta { font-family: 'Rubik', sans-serif; font-weight: 800; font-size: 40px; }
  .cta span { color: var(--salmon); }
  .bottom img { height: 56px; }
  .url { font-family: 'Rubik', sans-serif; font-weight: 700; font-size: 32px; direction: ltr; }
  .no-cta .bottom { justify-content: center; gap: 60px; }
  .big-kicker .kicker { font-size: 46px; padding: 18px 44px; top: 64px; }   /* ads: the audience call-out must read at feed size */
  .main { position: absolute; right: 80px; left: 80px; top: 200px; bottom: 200px; display: flex; flex-direction: column; justify-content: center; }
  .title { font-family: 'Karantina', sans-serif; font-weight: 700; font-size: 190px; line-height: .92; letter-spacing: -.01em; }
  .body { margin-top: 50px; font-size: 50px; line-height: 1.45; font-weight: 500; max-width: 880px; }

  /* ── statement: כותרת ענקית על navy (ברירת מחדל) ── */
  .l-statement .stripe { position: absolute; inset: 0 auto 0 0; width: 520px; background: linear-gradient(115deg, rgba(57,171,226,.22), rgba(57,171,226,0) 60%); clip-path: polygon(0 0, 100% 0, 40% 100%, 0 100%); }
  .l-statement .body { color: rgba(255,255,255,.88); border-right: 8px solid var(--blue); padding-right: 34px; }

  .l-light .logo, .l-salmon .logo, .l-list .logo { content: url('assets/hk-logo-navy.png'); }
  /* ── light: רקע בהיר, כותרת navy ── */
  .l-light { background: var(--off); color: var(--navy); }
  .l-light .kicker { background: var(--navy); color: #fff; }
  .l-light .body { color: var(--muted); border-right: 8px solid var(--salmon); padding-right: 34px; }
  .l-light .bottom { background: var(--navy); color: #fff; }
  .l-light .bottom img { filter: brightness(0) invert(1); }
  .l-light::after { content: ''; position: absolute; width: 900px; height: 900px; border-radius: 50%; background: radial-gradient(circle, rgba(57,171,226,.18), transparent 65%); left: -300px; bottom: -200px; }

  /* ── salmon: רקע סלמון, טקסט navy ── */
  .l-salmon { background: var(--salmon); color: var(--navy); }
  .l-salmon em { color: #fff; }
  .l-salmon .kicker { background: var(--navy); color: #fff; }
  .l-salmon .body { color: rgba(12,64,104,.85); border-right: 8px solid #fff; padding-right: 34px; }
  .l-salmon .bottom { background: var(--navy); color: #fff; }
  .l-salmon .bottom .cta span { color: var(--salmon); }
  .l-salmon .bottom img { filter: brightness(0) invert(1); }

  /* ── chat: שיחת וואטסאפ ── */
  .l-chat .main { justify-content: flex-start; padding-top: 30px; }
  .l-chat .title { font-size: 120px; margin-bottom: 40px; }
  .chat { display: flex; flex-direction: column; gap: 22px; }
  .bub { max-width: 82%; padding: 26px 34px; border-radius: 28px; font-size: 40px; line-height: 1.4; font-weight: 500; position: relative; }
  .bub.q { align-self: flex-start; background: #dcf8c6; color: #1a1a1a; border-top-left-radius: 6px; }
  .bub.a { align-self: flex-end; background: #fff; color: #1a1a1a; border-top-right-radius: 6px; }
  .bub .t { display: block; font-size: 22px; color: #7a8a99; margin-top: 8px; text-align: left; }
  .bub.a b { color: var(--navy); }

  /* ── versus: זה מול זה ── */
  .l-versus .title { font-size: 130px; margin-bottom: 44px; text-align: center; }
  .vs { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  .col { border-radius: 26px; padding: 40px 34px; min-height: 520px; }
  .col.bad { background: rgba(255,255,255,.08); border: 2px solid rgba(255,255,255,.18); }
  .col.good { background: #fff; color: var(--navy); }
  .col h3 { font-family: 'Rubik', sans-serif; font-size: 44px; font-weight: 800; margin-bottom: 26px; }
  .col.bad h3 { color: rgba(255,255,255,.7); }
  .col.good h3 { color: var(--salmon2); }
  .col li { list-style: none; font-size: 36px; line-height: 1.4; margin-bottom: 18px; padding-right: 44px; position: relative; }
  .col li::before { position: absolute; right: 0; font-weight: 800; }
  .col.bad li::before { content: '✕'; color: var(--salmon); }
  .col.good li::before { content: '✓'; color: #2e9e6b; }

  /* ── list: רשימה ממוספרת ── */
  .l-list { background: var(--off); color: var(--navy); }
  .l-list .kicker { background: var(--navy); color: #fff; }
  .l-list .bottom { background: var(--navy); color: #fff; }
  .l-list .bottom img { filter: brightness(0) invert(1); }
  .l-list .title { font-size: 140px; margin-bottom: 44px; }
  .steps { display: flex; flex-direction: column; gap: 22px; }
  .step { display: flex; gap: 30px; align-items: flex-start; background: #fff; border-radius: 24px; padding: 30px 34px; box-shadow: 0 6px 24px rgba(12,64,104,.08); }
  .step i { font-style: normal; font-family: 'Karantina', sans-serif; font-size: 96px; line-height: .8; color: var(--salmon); flex-shrink: 0; width: 80px; }
  .step div { font-size: 38px; line-height: 1.4; color: var(--text); }
  .step b { display: block; font-family: 'Rubik', sans-serif; font-size: 42px; color: var(--navy); margin-bottom: 4px; }

  /* ── photo: אדם + כותרת ── */
  .l-photo .photo { position: absolute; left: -40px; bottom: 160px; height: 760px; }
  .l-photo .main { right: 80px; left: 520px; top: 200px; bottom: 200px; }
  .l-photo .title { font-size: 150px; }
  .l-photo .body { color: rgba(255,255,255,.88); font-size: 44px; border-right: 8px solid var(--blue); padding-right: 30px; }

  /* ── l-studio-mock: קריאייטיב הסטודיו לפי בריף 04.10 — רקע לבן, לוגו למעלה, כותרת ענקית במרכז, מוקאפ, שלושה יתרונות, כפתור קורל ── */
  .l-studio-mock { background: #fff; color: var(--navy); }
  .l-studio-mock .logo, .l-studio-mock .kicker, .l-studio-mock .bottom, .l-studio-mock .stripe { display: none; }
  .l-studio-mock .main { inset: 0; padding: 56px 64px 54px; justify-content: flex-start; align-items: center; text-align: center; }
  .sm-logo { height: 62px; margin-bottom: 34px; }
  .l-studio-mock .title { font-family: 'Rubik', sans-serif; font-weight: 800; font-size: 84px; line-height: 1.08; letter-spacing: -.02em; color: var(--navy); }
  .l-studio-mock .title em { color: #E8635A; }
  .sm-sub { font-family: 'Rubik', sans-serif; font-weight: 700; font-size: 31px; color: var(--navy); margin-top: 20px; }
  .sm-line { font-size: 27px; color: var(--muted); margin-top: 8px; }
  .sm-mock { margin-top: 30px; width: 800px; }
  .sm-screen { border: 12px solid #16283a; border-bottom-width: 14px; border-radius: 20px 20px 4px 4px; overflow: hidden; background: #16283a; box-shadow: 0 30px 60px rgba(12,64,104,.22); }
  .sm-screen img { display: block; width: 100%; }
  .sm-base { height: 18px; margin: 0 -56px; background: linear-gradient(#dfe7ee, #b9c6d2); border-radius: 0 0 26px 26px; }
  .sm-ben { display: flex; justify-content: center; gap: 46px; margin-top: 34px; }
  .sm-ben div { display: flex; flex-direction: column; align-items: center; gap: 12px; font-family: 'Rubik', sans-serif; font-weight: 700; font-size: 28px; width: 290px; }
  .sm-ben svg { width: 62px; height: 62px; padding: 14px; border-radius: 50%; background: #EAF4FB; stroke: var(--navy); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; box-sizing: content-box; }
  .sm-cta { margin-top: auto; background: #E8635A; color: #fff; font-family: 'Rubik', sans-serif; font-weight: 800; font-size: 40px; padding: 22px 76px; border-radius: 60px; box-shadow: 0 14px 30px rgba(232,99,90,.35); }

  /* ── l-studio-secret: "ששש… יש משהו שאסור לנו לספר לך (עד עכשיו)" — בריף אייל 04.10: סוד/חשיפה, נייר קרוע, דמות, מוקאפ מחשב+מובייל ── */
  .l-studio-secret { background: #fff; color: var(--navy); }
  .l-studio-secret .logo, .l-studio-secret .kicker, .l-studio-secret .bottom, .l-studio-secret .stripe { display: none; }
  .l-studio-secret .main { inset: 0; padding: 0; justify-content: flex-start; display: block; }
  .ss-logo { position: absolute; top: 44px; right: 64px; height: 54px; }
  .ss-head { position: absolute; top: 118px; right: 64px; left: 330px; text-align: right; font-family: 'Rubik', sans-serif; font-weight: 800; color: var(--navy); line-height: 1.04; letter-spacing: -.02em; }
  .ss-head .sh { font-size: 96px; color: #E8635A; letter-spacing: .01em; }
  .ss-head .t { font-size: 78px; display: block; }
  .ss-head .u { font-size: 46px; font-weight: 700; color: #E8635A; display: block; margin-top: 10px; letter-spacing: 0; }
  .ss-fig { position: absolute; top: 108px; left: 30px; width: 300px; }
  .ss-band { position: absolute; top: 500px; left: 0; right: 0; height: 480px; background: linear-gradient(165deg, var(--navy), var(--navy2)); }
  .ss-tear { position: absolute; left: 0; right: 0; height: 46px; width: 100%; display: block; }
  .ss-tear.top { top: -1px; } .ss-tear.bot { bottom: -1px; transform: scaleY(-1); }
  .ss-sub { position: absolute; top: 66px; right: 64px; width: 420px; color: #fff; font-family: 'Rubik', sans-serif; font-weight: 800; font-size: 40px; line-height: 1.2; text-align: right; }
  .ss-plus { position: absolute; top: 256px; right: 64px; width: 420px; color: #8fd0f3; font-family: 'Rubik', sans-serif; font-weight: 600; font-size: 25px; line-height: 1.4; text-align: right; }
  .ss-lap { position: absolute; top: 66px; left: 64px; width: 470px; }
  .ss-lap .scr { border: 9px solid #0b1b2b; border-radius: 14px 14px 3px 3px; overflow: hidden; background: #0b1b2b; box-shadow: 0 26px 50px rgba(0,0,0,.4); }
  .ss-lap img { display: block; width: 100%; } .ss-lap .base { height: 13px; margin: 0 -34px; background: linear-gradient(#e6edf3, #b9c6d2); border-radius: 0 0 20px 20px; }
  .ss-ph { position: absolute; top: 112px; left: 430px; width: 150px; border: 7px solid #0b1b2b; border-radius: 26px; overflow: hidden; background: #0b1b2b; box-shadow: 0 22px 44px rgba(0,0,0,.5); }
  .ss-ph img { display: block; width: 100%; }
  .ss-feat { position: absolute; top: 1010px; left: 48px; right: 48px; display: flex; gap: 22px; }
  .ss-feat div { flex: 1; text-align: center; }
  .ss-feat svg { width: 46px; height: 46px; padding: 12px; border-radius: 50%; background: #FDECEA; stroke: #E8635A; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; box-sizing: content-box; }
  .ss-feat b { display: block; font-family: 'Rubik', sans-serif; font-weight: 800; font-size: 27px; margin: 8px 0 2px; color: var(--navy); }
  .ss-feat span { font-size: 21px; color: var(--muted); line-height: 1.3; display: block; }
  .ss-cta { position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); background: #E8635A; color: #fff; font-family: 'Rubik', sans-serif; font-weight: 800; font-size: 38px; padding: 18px 70px; border-radius: 60px; box-shadow: 0 14px 30px rgba(232,99,90,.35); white-space: nowrap; }
</style>
</head>
<body>
  <div class="stripe"></div>
  <img class="logo" src="assets/hk-logo.png" alt="" />
  <span class="kicker" id="kicker"></span>
  <img class="photo" id="photo" src="" alt="" hidden />
  <div class="main" id="main"></div>
  <div class="bottom">
    <div class="cta" id="cta"></div>
    <img id="svc" src="" alt="" />
    <div class="url" id="url">hak.co.il</div>
  </div>
<script>
  const P = /*POST_JSON*/{}/*END*/;
  const layout = P.layout || 'statement';
  document.body.classList.add('l-' + layout);
  document.getElementById('kicker').textContent = P.kicker || '';
  if (P.kicker_size === 'big') document.body.classList.add('big-kicker');
  document.getElementById('url').textContent = P.url || 'hak.co.il';
  const cta = document.getElementById('cta');
  if (P.cta === '' || (typeof P.cta === 'string' && !P.cta.trim())) { cta.remove(); document.body.classList.add('no-cta'); }
  else cta.innerHTML = P.cta || 'פגישת אבחון <span>חינם</span>';
  const svc = document.getElementById('svc');
  const logos = { hkmoney: 'assets/hkmoney-logo.png', hkpro: 'assets/hkpro-logo.png', studio: 'assets/studio-logo.png' };
  if (logos[P.logo]) svc.src = logos[P.logo]; else svc.remove();
  const main = document.getElementById('main');
  const h = P.title ? `<h1 class="title">${P.title}</h1>` : '';
  if (layout === 'chat') {
    main.innerHTML = h + '<div class="chat">' + (P.chat || []).map(m =>
      `<div class="bub ${m.from === 'q' ? 'q' : 'a'}">${m.text}<span class="t">${m.time || ''}</span></div>`).join('') + '</div>';
  } else if (layout === 'versus') {
    const li = a => (a || []).map(x => `<li>${x}</li>`).join('');
    main.innerHTML = h + `<div class="vs"><div class="col bad"><h3>${P.left.title}</h3><ul>${li(P.left.items)}</ul></div><div class="col good"><h3>${P.right.title}</h3><ul>${li(P.right.items)}</ul></div></div>`;
  } else if (layout === 'list') {
    main.innerHTML = h + '<div class="steps">' + (P.steps || []).map((s, i) =>
      `<div class="step"><i>${String(i + 1).padStart(2, '0')}</i><div><b>${s.title}</b>${s.text || ''}</div></div>`).join('') + '</div>';
  } else if (layout === 'studio-mock') {
    const ic = { keep: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="m16 11 2 2 4-4"/>',
                 full: '<path d="M12 2 2 7l10 5 10-5-10-5z"/><path d="m2 17 10 5 10-5"/><path d="m2 12 10 5 10-5"/>',
                 load: '<path d="M12 5v14"/><path d="m19 12-7 7-7-7"/>' };
    main.innerHTML = '<img class="sm-logo" src="assets/studio-logo.png" alt="">' + h +
      (P.body ? `<div class="sm-sub">${P.body}</div>` : '') + (P.kicker ? `<div class="sm-line">${P.kicker}</div>` : '') +
      `<div class="sm-mock"><div class="sm-screen"><img src="${P.photo || 'assets/studio-timeline.jpg'}" alt=""></div><div class="sm-base"></div></div>` +
      '<div class="sm-ben">' + (P.steps || []).map(b => `<div><svg viewBox="0 0 24 24">${ic[b.text] || ic.full}</svg>${b.title}</div>`).join('') + '</div>' +
      (P.cta ? `<div class="sm-cta">${P.cta}</div>` : '');
  } else if (layout === 'studio-secret') {
    const tear = '<svg class="ss-tear TT" viewBox="0 0 1080 46" preserveAspectRatio="none"><path fill="#fff" d="M0 0H1080V20L1052 31 1021 18 990 34 957 22 921 37 886 21 850 33 816 17 779 36 742 23 707 39 668 20 633 34 596 19 560 37 521 24 486 35 449 18 412 38 376 22 338 33 303 19 266 37 229 21 193 36 157 20 121 34 84 18 47 35 20 23 0 31Z"/></svg>';
    const ic = ['<path d="M3 3v18h18"/><path d="m7 15 4-5 4 3 5-7"/>', '<rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/><path d="m9 10 2 2 4-4"/>', '<path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.500-1 8-4 8-9V6l-8-3z"/><path d="m9 12 2 2 4-4"/>'];
    const fig = '<svg class="ss-fig" viewBox="0 0 310 400" fill="none" stroke-linecap="round" stroke-linejoin="round">' +
      '<path d="M22 400c4-62 52-100 133-100s129 38 133 100z" fill="#0c4068"/>' +
      '<path d="M120 300l35 34 35-34" stroke="#fff" stroke-width="5"/>' +
      '<path d="M126 248h58v52c0 18-58 18-58 0z" fill="#f2cfb8"/>' +
      '<ellipse cx="68" cy="176" rx="14" ry="20" fill="#f2cfb8"/><ellipse cx="242" cy="176" rx="14" ry="20" fill="#f2cfb8"/>' +
      '<path d="M72 150c0-58 36-92 83-92s83 34 83 92v30c0 56-36 92-83 92s-83-36-83-92z" fill="#f7dcc8"/>' +
      '<path d="M68 152c-6-66 34-112 90-112 50 0 90 32 86 104-18-10-30-30-34-52-30 26-84 34-126 30-8 8-14 18-16 30z" fill="#082f4d"/>' +
      '<path d="M104 150q18-12 34-2" stroke="#082f4d" stroke-width="6"/><path d="M174 148q18-10 34 2" stroke="#082f4d" stroke-width="6"/>' +
      '<circle cx="122" cy="176" r="8" fill="#082f4d"/><path d="M178 178q13-10 26 0" stroke="#082f4d" stroke-width="6"/>' +
      '<path d="M128 236q27 12 54 0" stroke="#c9695a" stroke-width="6"/>' +
      '<rect x="143" y="186" width="24" height="96" rx="12" fill="#f7dcc8" stroke="#082f4d" stroke-width="4.5"/>' +
      '<path d="M128 284c0-12 8-18 20-18h24c26 0 40 12 40 30v20c0 20-16 30-42 30s-42-10-42-30z" fill="#f7dcc8" stroke="#082f4d" stroke-width="4.5"/>' +
      '<path d="M146 296h44M146 314h44" stroke="#082f4d" stroke-width="3.5" opacity=".3"/>' +
      '<path d="M262 104q14-10 22-26M274 134q16-4 28-14M254 78q6-14 8-30" stroke="#E8635A" stroke-width="6"/></svg>';
    const t = (P.title || '').split('|');
    main.innerHTML = '<img class="ss-logo" src="assets/studio-logo.png" alt="">' + fig +
      `<div class="ss-head"><span class="sh">${P.kicker || ''}</span><span class="t">${t[0] || ''}</span><span class="t">${t[1] || ''}</span><span class="u">${t[2] || ''}</span></div>` +
      `<div class="ss-band">${tear.replace('TT','top')}<div class="ss-sub">${P.body || ''}</div><div class="ss-plus">${(P.left && P.left.title) || ''}</div>` +
      `<div class="ss-lap"><div class="scr"><img src="${P.photo || 'assets/studio-timeline.jpg'}" alt=""></div><div class="base"></div></div><div class="ss-ph"><img src="assets/studio-app-home.jpg" alt=""></div>${tear.replace('TT','bot')}</div>` +
      '<div class="ss-feat">' + (P.steps || []).map((b, i) => `<div><svg viewBox="0 0 24 24">${ic[i % 3]}</svg><b>${b.title}</b><span>${b.text || ''}</span></div>`).join('') + '</div>' +
      (P.cta ? `<div class="ss-cta">${P.cta}</div>` : '');
  } else {
    main.innerHTML = h + (P.body ? `<p class="body">${P.body}</p>` : '');
    if (layout === 'photo') { const ph = document.getElementById('photo'); ph.src = P.photo || 'assets/person-phone.png'; ph.hidden = false; }
  }
  // מקטין כותרת ארוכה כדי שלא תגלוש
  const t = main.querySelector('.title');
  if (t) { let size = parseFloat(getComputedStyle(t).fontSize); const max = { chat: 260, versus: 280, list: 300, photo: 480 }[layout] || 620;
    while (t.scrollHeight > max && size > 90) { size -= 6; t.style.fontSize = size + 'px'; } }
</script>
</body>
</html>
