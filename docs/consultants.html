<!DOCTYPE html><html lang="he" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>יועצים · סושיאל</title><meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&family=Rubik:wght@500;700;800&display=swap">
<style>
:root{--navy:#0c4068;--navy-2:#082f4d;--navy2:#082f4d;--salmon:#e48375;--blue:#39abe2;--sky:#39abe2;--coral:#E8635A;--off:#eef4f9;
--bg:#f6f9fc;--surface:#fff;--card:#fff;--ink:#16283a;--muted:#5a6b7c;--line:#d5e2ec;--tint:#e4f0f8;--soft:#e4f0f8;--good:#2e9e6b;--green:#13895B;--bad:#c0392b;--amber:#D9922B}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Heebo,Rubik,Arial,sans-serif;line-height:1.6}
.sh-top{background:var(--navy-2);color:#fff;padding:18px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.sh-top a{color:#fff;text-decoration:none;font-weight:700}.sh-top .sh-sub{color:var(--blue);font-size:14px}
.sh-tabs{display:flex;gap:6px;padding:16px 24px 0;max-width:1100px;margin:0 auto}
.sh-tabs button{font:inherit;font-weight:700;padding:10px 18px;border:1px solid var(--line);border-bottom:0;background:#fff;color:var(--muted);border-radius:12px 12px 0 0;cursor:pointer}
.sh-tabs button[aria-selected=true]{color:var(--navy);border-color:var(--navy);border-bottom:2px solid #fff;margin-bottom:-1px}
.sh-panel{max-width:1100px;margin:0 auto;padding:24px;background:#fff;border-top:1px solid var(--navy)}
.sh-panel[hidden]{display:none}
.sh-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
.sh-card{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff;border-top:4px solid var(--salmon)}
.sh-card img{width:100%;display:block;aspect-ratio:4/5;object-fit:cover;background:var(--off)}
.sh-card .m{padding:12px 14px;font-size:14px}.sh-card .r{display:flex;justify-content:space-between;font-weight:700}
.sh-card .cap{color:var(--ink);white-space:pre-line;margin:8px 0 0;font-size:13.5px;line-height:1.5}
.sh-card .st{font-size:12px;color:var(--muted)}.sh-h small{font-size:.6em;font-weight:400}.s-approved{border-top-color:var(--good)}.s-published{border-top-color:var(--navy);opacity:.75}
.sh-h{font-family:Rubik,Heebo,sans-serif;color:var(--navy);margin:28px 0 12px;font-size:22px}.sh-h:first-child{margin-top:0}
.sh-empty{color:var(--muted);padding:14px;border:1px dashed var(--line);border-radius:12px}
@media(max-width:600px){.sh-panel{padding:16px}}

.cz{max-width:1280px;margin:0 auto;padding:20px 24px 60px}
.cz h1{font-family:Rubik,Heebo,sans-serif;color:var(--navy);font-size:26px;margin:6px 0 2px}
.cz .lede{color:var(--muted);margin:0 0 16px;font-size:14.5px}
.cz-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;position:sticky;top:0;z-index:5}
.cz-bar input[type=search],.cz-bar select{font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);min-width:0}
.cz-bar input[type=search]{flex:1 1 220px}.cz-bar select{flex:0 1 170px}
.cz-bar label{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--ink);white-space:nowrap}
.cz-bar button,.cz-more{font:inherit;font-weight:700;padding:9px 16px;border-radius:10px;border:1px solid var(--navy);background:var(--navy);color:#fff;cursor:pointer}
.cz-bar button.sec{background:#fff;color:var(--navy)}
.cz-fin{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 14px}.cz-fin div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 16px;min-width:130px}
.cz-fin b{display:block;font-family:Rubik,Heebo,sans-serif;font-size:24px;color:var(--navy);line-height:1.2;font-variant-numeric:tabular-nums}.cz-fin span{font-size:13px;color:var(--muted)}
.cz-fin .all{background:transparent;border-style:dashed}.cz-fin .all b{color:var(--muted)}.cz-count a{color:var(--navy);font-weight:700}
.cz-tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;margin:0 0 6px}
.cz-tabs button{font:inherit;font-weight:700;flex:0 0 auto;padding:9px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--muted);cursor:pointer;text-align:right;line-height:1.3}
.cz-tabs button b{color:var(--navy);font-variant-numeric:tabular-nums}.cz-tabs button small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.cz-tabs button[aria-selected=true]{background:var(--navy);border-color:var(--navy);color:#fff}.cz-tabs button[aria-selected=true] b{color:#fff}.cz-tabs button[aria-selected=true] small{color:#cfe3f1}
.cz-count{margin:14px 2px 8px;color:var(--muted);font-size:14px}.cz-count b{color:var(--navy);font-size:17px}
.cz-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:#fff}
.cz table{border-collapse:collapse;width:100%;font-size:14px;min-width:880px}
.cz th{position:sticky;top:0;background:var(--tint);color:var(--navy);text-align:right;padding:10px 12px;font-size:12.5px;white-space:nowrap}
.cz td{padding:10px 12px;border-top:1px solid var(--line);vertical-align:top}
.cz td.n{font-weight:700;color:var(--navy);min-width:180px}.cz td.n small{display:block;font-weight:400;color:var(--muted);font-size:12.5px;margin-top:2px}
.cz td a{color:var(--navy);text-decoration:none;border-bottom:1px solid var(--line)}.cz td a:hover{border-bottom-color:var(--navy)}
.cz .ph{direction:ltr;unicode-bidi:embed;white-space:nowrap;font-variant-numeric:tabular-nums}
.cz .seg{display:inline-block;padding:2px 9px;border-radius:50px;background:var(--tint);color:var(--navy);font-size:12.5px;font-weight:700;white-space:nowrap}
.cz .seg.top{background:rgba(228,131,117,.18);color:#a8483a}
.cz .ex{display:inline-block;padding:2px 9px;border-radius:50px;background:rgba(46,158,107,.14);color:#1f7550;font-size:12.5px;font-weight:700}
.cz .rt{white-space:nowrap;font-variant-numeric:tabular-nums}.cz .rt small{color:var(--muted)}
.cz-more{display:block;margin:16px auto 0}
.cz-lock{max-width:440px;margin:60px auto;background:#fff;border:1px solid var(--line);border-radius:18px;padding:28px;text-align:center}
.cz-lock h2{font-family:Rubik,sans-serif;color:var(--navy);margin:0 0 6px}.cz-lock p{color:var(--muted);margin:0 0 16px;font-size:14.5px}
.cz-lock input{font:inherit;width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;direction:ltr;text-align:center}
.cz-lock button{font:inherit;font-weight:700;width:100%;margin-top:10px;padding:12px;border:0;border-radius:10px;background:var(--navy);color:#fff;cursor:pointer}
.cz-err{color:var(--bad);font-size:13px;min-height:1.4em;margin-top:8px}
@media(max-width:640px){.cz{padding:14px 16px 50px}.cz-bar{position:static}.cz-bar select{flex:1 1 44%}}
</style><script>
(function(){
  try{ if(sessionStorage.getItem('hk-site-ok')==='1'){ document.documentElement.classList.add('ok'); return; } }catch(e){}
  if(/index\.html$|\/$/.test(location.pathname)) return;
  location.replace('index.html');
})();
</script></head><body>
<div class="sh-top"><div><a href="index.html">← כל העמודים</a></div><div><b>יועצים</b> <span class="sh-sub">רשימת פנייה · HK Studio</span></div></div>
<div class="cz">
  <div id="lock" class="cz-lock" hidden><h2>רשימת היועצים</h2><p id="lockmsg">הרשימה מוצפנת. הקלד את סיסמת האתר כדי לפתוח אותה.</p>
    <form id="lf"><input id="lpw" type="password" autocomplete="current-password" placeholder="סיסמה" required><button>פתיחה</button><div class="cz-err" id="lerr"></div></form></div>
  <div id="app" hidden>
    <h1>יועצים לפנייה</h1><p class="lede" id="lede"></p>
    <div class="cz-fin" id="fin"></div>
    <div class="cz-tabs" id="tabs" role="tablist" aria-label="סוג היועץ"></div>
    <div class="cz-bar">
      <input id="q" type="search" placeholder="חיפוש לפי שם, עיר, טלפון או מייל" aria-label="חיפוש">
      <select id="fcity" aria-label="עיר"></select><select id="fsrc" aria-label="מקור"></select>
      <select id="sort" aria-label="מיון"><option value="pri">מיון: לפי עדיפות</option><option value="rating">מיון: דירוג</option><option value="reviews">מיון: מספר ביקורות</option><option value="name">מיון: שם</option></select>
      <label><input type="checkbox" id="hideex" checked> להסתיר לקוחות קיימים</label>
      <label><input type="checkbox" id="hasmail"> יש מייל</label>
      <label><input type="checkbox" id="hassite"> יש אתר</label>
      <button id="csv" class="sec" type="button">ייצוא CSV</button>
    </div>
    <p class="cz-count" id="count"></p>
    <div class="cz-wrap"><table><thead><tr><th>שם</th><th>תחום</th><th>עיר</th><th>טלפון</th><th>מייל</th><th>אתר</th><th>דירוג</th><th>מקור</th></tr></thead><tbody id="rows"></tbody></table></div>
    <button id="more" class="cz-more" type="button" hidden>הצג עוד</button>
  </div>
</div>
<script>
(function(){
  var PRI=['יועץ פיננסי לעסקים','CFO / ניהול כספים','כלכלן','יועץ עסקי','תכנון פיננסי','יועץ משכנתאות','יועץ מס','רואה חשבון'];
  var FIN=['יועץ פיננסי לעסקים','CFO / ניהול כספים','כלכלן','תכנון פיננסי'];
  // לשונית לכל סוג: [מפתח לקישור (#tab=…), ערך segment בקובץ, כותרת]. 'all' = הכל.
  var TABS=[['fin','יועץ פיננסי לעסקים','יועצים פיננסיים לעסקים'],['cfo','CFO / ניהול כספים','CFO / ניהול כספים'],['econ','כלכלן','כלכלנים'],['plan','תכנון פיננסי','תכנון פיננסי'],
    ['biz','יועץ עסקי','יועצים עסקיים'],['tax','יועץ מס','יועצי מס'],['all','','הכל']], tab='fin';
  function tabSeg(){for(var i=0;i<TABS.length;i++)if(TABS[i][0]===tab)return TABS[i][1];return ''}
  var PAGE=100, $=function(id){return document.getElementById(id)}, meta=null, all=[], view=[], shown=0;
  function fin(r){return FIN.indexOf(r.segment)>=0}
  function dec(t){return Uint8Array.from(atob(t),function(c){return c.charCodeAt(0)})}
  function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  async function derive(pw){
    var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
    return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:dec(meta.salt),iterations:meta.iter},base,256));
  }
  async function unlock(raw){
    var key=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);
    var plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:dec(meta.iv)},key,dec(meta.ct));
    var text=await new Response(new Blob([plain]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
    return JSON.parse(text);
  }
  function pri(r){var i=PRI.indexOf(r.segment);return i<0?PRI.length:i}
  function fill(sel,label,values){sel.innerHTML='<option value="">'+esc(label)+'</option>'+values.map(function(v){return '<option value="'+esc(v[0])+'">'+esc(v[0])+' ('+v[1]+')</option>'}).join('')}
  function counts(key,order){
    var m={};all.forEach(function(r){var v=r[key];if(v)m[v]=(m[v]||0)+1});
    var a=Object.keys(m).map(function(k){return [k,m[k]]});
    a.sort(order||function(x,y){return y[1]-x[1]||x[0].localeCompare(y[0],'he')});return a;
  }
  function site(u){u=String(u||'').trim();if(!u)return '';if(!/^https?:\/\//i.test(u))u='https://'+u;try{var x=new URL(u);return /^https?:$/.test(x.protocol)?x.href:''}catch(e){return ''}}
  function row(r){
    var tel=String(r.phone||'').replace(/[^0-9+]/g,''), w=site(r.website), host='';
    if(w){try{host=new URL(w).hostname.replace(/^www\./,'')}catch(e){}}
    return '<tr><td class="n">'+esc(r.name)+(r.existing?' <span class="ex">לקוח קיים'+(r.existing_status?' · '+esc(r.existing_status):'')+'</span>':'')+(r.note?'<small>'+esc(r.note)+'</small>':'')+'</td>'
      +'<td><span class="seg'+(pri(r)<2?' top':'')+'">'+esc(r.segment)+'</span></td><td>'+esc(r.city)+'</td>'
      +'<td>'+(tel?'<a class="ph" href="tel:'+esc(tel)+'">'+esc(r.phone)+'</a>':'')+'</td>'
      +'<td>'+(r.email?'<a href="mailto:'+esc(r.email)+'">'+esc(r.email)+'</a>':'')+'</td>'
      +'<td>'+(w?'<a href="'+esc(w)+'" target="_blank" rel="noopener noreferrer">'+esc(host||'אתר')+'</a>':'')+'</td>'
      +'<td class="rt">'+(r.rating?esc(r.rating)+(r.reviews?' <small>('+esc(r.reviews)+')</small>':''):'')+'</td><td>'+esc(r.source)+'</td></tr>';
  }
  function more(){var next=view.slice(shown,shown+PAGE);$('rows').insertAdjacentHTML('beforeend',next.map(row).join(''));shown+=next.length;$('more').hidden=shown>=view.length;if(!$('more').hidden)$('more').textContent='הצג עוד ('+(view.length-shown).toLocaleString('he-IL')+' נוספים)'}
  function apply(){
    var q=$('q').value.trim().toLowerCase(), seg=tabSeg(), city=$('fcity').value, src=$('fsrc').value, he=$('hideex').checked, hm=$('hasmail').checked, hs=$('hassite').checked, so=$('sort').value;
    var qd=q.replace(/[^0-9]/g,'');
    view=all.filter(function(r){
      if(he&&r.existing)return false; if(seg&&r.segment!==seg)return false; if(city&&r.city!==city)return false;
      if(src&&String(r.source||'').indexOf(src)<0)return false; if(hm&&!r.email)return false; if(hs&&!r.website)return false;
      if(!q)return true;
      return (r._t.indexOf(q)>=0)||(qd.length>=3&&r._d.indexOf(qd)>=0);
    });
    var num=function(v){return v==null||v===''?-1:+v};
    view.sort(so==='rating'?function(a,b){return num(b.rating)-num(a.rating)||num(b.reviews)-num(a.reviews)}
      :so==='reviews'?function(a,b){return num(b.reviews)-num(a.reviews)}
      :so==='name'?function(a,b){return String(a.name).localeCompare(String(b.name),'he')}
      :function(a,b){return pri(a)-pri(b)||num(b.reviews)-num(a.reviews)||num(b.rating)-num(a.rating)||String(a.name).localeCompare(String(b.name),'he')});
    $('rows').innerHTML='';shown=0;more();
    var inTab=seg?all.filter(function(r){return r.segment===seg}).length:all.length;
    $('count').innerHTML='מוצגים <b>'+view.length.toLocaleString('he-IL')+'</b> מתוך '+inTab.toLocaleString('he-IL')+' בלשונית הזו';
  }
  function csv(){
    var cols=[['name','שם'],['segment','תחום'],['city','עיר'],['phone','טלפון'],['email','מייל'],['website','אתר'],['rating','דירוג'],['reviews','ביקורות'],['source','מקור'],['existing_status','סטטוס לקוח קיים'],['note','הערה']];
    var q=function(v){v=String(v==null?'':v);if(/^[=+\-@]/.test(v)&&!/^\+?[0-9 ()-]+$/.test(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"'};
    var out=[cols.map(function(c){return q(c[1])}).join(',')].concat(view.map(function(r){return cols.map(function(c){return q(r[c[0]])}).join(',')}));
    var a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['﻿'+out.join('\r\n')],{type:'text/csv;charset=utf-8'}));
    a.download='consultants-'+tab+'-'+view.length+'.csv';document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},500);
  }
  function start(rows){
    all=rows;all.forEach(function(r){r._t=[r.name,r.city,r.email,r.segment,r.note].join(' ').toLowerCase();r._d=String(r.phone||'').replace(/[^0-9]/g,'')});
    var f=all.filter(fin), n=function(v){return v.toLocaleString('he-IL')};
    var hm=(location.hash.match(/tab=([a-z]+)/)||[])[1]; if(hm&&TABS.some(function(t){return t[0]===hm})) tab=hm;
    $('tabs').innerHTML=TABS.map(function(t){var rs=t[1]?all.filter(function(r){return r.segment===t[1]}):all;
      return '<button type="button" role="tab" data-tab="'+t[0]+'" aria-selected="'+(t[0]===tab)+'">'+esc(t[2])+' <b>'+n(rs.length)+'</b><small>'+n(rs.filter(function(r){return r.email}).length)+' עם מייל</small></button>'}).join('');
    $('tabs').addEventListener('click',function(e){var b=e.target.closest('button[data-tab]');if(!b)return;tab=b.getAttribute('data-tab');
      $('tabs').querySelectorAll('button').forEach(function(x){x.setAttribute('aria-selected',x===b)});try{history.replaceState(null,'','#tab='+tab)}catch(x){} apply()});
    $('fin').innerHTML='<div><b>'+n(f.length)+'</b><span>יועצים פיננסיים (4 הלשוניות הראשונות)</span></div><div><b>'+n(f.filter(function(r){return r.phone}).length)+'</b><span>מהם עם טלפון</span></div>'
      +'<div><b>'+n(f.filter(function(r){return r.email}).length)+'</b><span>מהם עם מייל</span></div><div class="all"><b>'+n(all.length)+'</b><span>סך הכול ברשימה, כל התחומים</span></div>';
    fill($('fcity'),'כל הערים',counts('city'));
    var sm={};all.forEach(function(r){String(r.source||'').split(' + ').forEach(function(v){if(v)sm[v]=(sm[v]||0)+1})});
    fill($('fsrc'),'כל המקורות',Object.keys(sm).map(function(k){return [k,sm[k]]}).sort(function(x,y){return y[1]-x[1]}));
    $('lede').textContent='לשונית לכל סוג יועץ, הפיננסיים ראשונים. החיפוש, הסינון והייצוא פועלים בתוך הלשונית הפתוחה. עודכן: '+String(meta.updated||'').replace('T',' ')+' · לשימוש פנימי בלבד.';
    ['q','fcity','fsrc','sort','hideex','hasmail','hassite'].forEach(function(id){$(id).addEventListener(id==='q'?'input':'change',apply)});
    $('more').addEventListener('click',more);$('csv').addEventListener('click',csv);
    $('lock').hidden=true;$('app').hidden=false;apply();
  }
  async function boot(){
    try{var r=await fetch('consultants.enc.json',{cache:'no-store'});if(!r.ok)throw 0;meta=await r.json()}
    catch(e){$('lock').hidden=false;$('lf').hidden=true;$('lockmsg').textContent='הרשימה עוד לא הועלתה לאתר.';return}
    if(!window.DecompressionStream||!crypto.subtle){$('lock').hidden=false;$('lf').hidden=true;$('lockmsg').textContent='הדפדפן הזה ישן מדי לפתיחת הרשימה. נסה Chrome או Safari מעודכן.';return}
    try{var k=sessionStorage.getItem('hk-ckey');if(k){start(await unlock(dec(k)));return}}catch(e){try{sessionStorage.removeItem('hk-ckey')}catch(x){}}
    $('lock').hidden=false;
    $('lf').addEventListener('submit',async function(e){
      e.preventDefault();$('lerr').textContent='';
      try{var raw=await derive($('lpw').value);var rows=await unlock(raw);try{sessionStorage.setItem('hk-ckey',btoa(String.fromCharCode.apply(null,raw)))}catch(x){} $('lpw').value='';start(rows)}
      catch(x){$('lerr').textContent='הסיסמה לא נכונה.'}
    });
  }
  boot();
})();
</script></body></html>
